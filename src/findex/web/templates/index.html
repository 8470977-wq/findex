<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>findex — Пошукова система</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px auto; max-width: 800px; line-height: 1.6; color: #333; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px 24px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .result-item { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
        .result-title { font-size: 18px; font-weight: bold; color: #0066cc; text-decoration: none; }
        .score { font-size: 12px; color: #888; margin-left: 10px; }
        .snippet { margin-top: 5px; font-size: 14px; color: #555; }
        mark { background: #ffe066; padding: 2px 4px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🔍 findex Search</h1>
    <form action="/" method="get" class="search-box">
        <input type="text" name="q" value="{{ query }}" placeholder="Введіть пошуковий запит..." required>
        <button type="submit">Пошук</button>
    </form>

    {% if query %}
        <h2>Результати для "{{ query }}" (всього: {{ total }})</h2>
        {% for item in results %}
            <div class="result-item">
                <a href="/docs/{{ item.doc_id }}" class="result-title">Документ #{{ item.doc_id }}</a>
                <span class="score">BM25 Score: {{ "%.4f"|format(item.score) }}</span>
                <div class="snippet">{{ item.snippet | safe }}</div>
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
