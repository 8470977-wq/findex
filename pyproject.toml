[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findex"
version = "0.1.0"
description = "Inverted index and search engine in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
findex = "findex.cli:main"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
