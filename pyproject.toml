[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findex"
version = "1.0.0"
description = "High-performance Python search engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "httpx",
    "psutil",
    "selectolax",
    "numpy"
]

[project.scripts]
findex = "findex.cli.app:app"

[tool.setuptools.package-data]
"findex.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
