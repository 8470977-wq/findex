[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findex"
version = "1.0.0"
description = "High-performance Python search engine with BM25, NumPy, Async Crawler, FastAPI & Semantic Hybrid Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "httpx",
    "psutil",
    "selectolax",
    "numpy",
    "sentence-transformers"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "mypy",
    "coverage"
]

[project.scripts]
findex = "findex.cli:app"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
